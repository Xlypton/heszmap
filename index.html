<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>HÉSZ térkép – Budapest</title>
  </head>
  <body>
    <aside id="panel">
      <div id="sheet-top">
        <button id="sheet-handle" type="button" aria-label="Panel kinyitása / becsukása" aria-expanded="false"><span></span></button>
      </div>
      <header>
        <h1>HÉSZ térkép</h1>
        <p class="sub">Budapest · prototípus</p>
      </header>
      <form id="search">
        <input id="q" type="search" placeholder="Cím, pl. Kossuth Lajos utca 20, XX. kerület" autocomplete="off" />
        <button type="submit">Keresés</button>
      </form>
      <div class="layers">
        <label><input id="plan-toggle" type="checkbox" checked /> Szabályozási terv</label>
        <input id="plan-opacity" type="range" min="20" max="100" value="80" aria-label="Szabályozási terv átlátszósága" />
      </div>
      <div id="card"><p class="hint">Keress egy címet, vagy kattints a térképre. Feldolgozott kerület: XX. Pesterzsébet.</p></div>
      <footer>
        <div class="legend">
          <span><i class="sw st-none"></i>nincs adat</span>
          <span><i class="sw st-linked"></i>szabályzat feldolgozva</span>
          <span><i class="sw st-digitized"></i>övezetek ellenőrizve</span>
        </div>
        <p class="disclaimer">Tájékoztató jellegű. Mindig ellenőrizd a hatályos rendeletet.</p>
      </footer>
    </aside>
    <main id="stage">
      <div id="map"></div>
      <section id="viewer" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
